name: MetaFetch Fetch Update

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'README.md'
      - 'list.*'
      - 'docs/**'
  schedule:
    - cron: '37 */4 * * *'  # 每 4 小时调度一次（主要服务于 Fork 用户，开箱即用自动更新）
  workflow_dispatch:      # 支持手动触发及外部 API (Cloudflare Workers) 调用

permissions:
  contents: write

# 限制单任务运行，防止定时调度与代码提交产生冲突
concurrency:
  group: meta-fetch-sync
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 主仓库由 Cloudflare Workers 外部高精定时托管，忽略自带 schedule 避免排队冲突；Fork 仓库则全自动启用原生 schedule
    if: github.repository != 'lanzm/MetaFetch' || github.event_name != 'schedule'
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Unit Tests
        run: |
          python -m unittest discover tests -v

      - name: Run Fetch Task
        env:
          PRIVATE_SOURCES: ${{ secrets.PRIVATE_SOURCES }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python main.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add list.meta.yml list.b64 list.txt README.md tg_msg_id.txt 2>/dev/null || git add list.meta.yml list.b64 list.txt README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto Update: $(date +'%Y-%m-%d %H:%M:%S')" && git pull --rebase origin master && git push origin master)
