# MetaFetch 订阅源清单 (Structured YAML Version)
# 重点聚焦实测测速源与抗丢包专属源（Hysteria2），剔除纯机械爬取的低质死节点源

sources:
  # ==========================================
  # 👑 实测高可用源：上游已进行真实测速 / 连通性测试
  # ==========================================
  - name: "📡 Zhangkai 系列 (speednodes)"
    url: "https://raw.githubusercontent.com/zhangkaiitugithub/passcro/main/speednodes.yaml"
    note: "上游机器人每日定时实测，产出高稳定性 speednode 节点（主要覆盖罗马尼亚、荷兰、美国等）"

  - name: "🔥🔥🔥 w1770946466 长期订阅"
    url: "https://raw.githubusercontent.com/w1770946466/Auto_proxy/main/Long_term_subscription_num"
    note: "包含 500+ 精选节点，自带实测下载速度 MB/s 标记"

  # ==========================================
  # ⚡ 抗丢包协议专属源 (Hysteria2 / VLESS)
  # ==========================================
  - name: "[长效备份] hy2 节点"
    url: "https://raw.githubusercontent.com/Surfboardv2ray/TGParse/main/python/hy2"
    note: "Hysteria2 UDP QUIC 极速协议"

  - name: "[长效备份] hysteria2 节点"
    url: "https://raw.githubusercontent.com/Surfboardv2ray/TGParse/main/python/hysteria2"
    note: "Hysteria2 UDP QUIC 极速协议"

  - name: "⚡ Misaka Chromego 聚合池"
    url: "https://raw.githubusercontent.com/Misaka-blog/chromego_merge/main/sub/merged_proxies_new.yaml"
    note: "高质量 Hysteria2 / VLESS 节点"

  # ==========================================
  # 🌐 备用与覆盖池
  # ==========================================
  - name: "🔥🔥🔥 日抛机场系列"
    url: "https://raw.githubusercontent.com/ripaojiedian/freenode/main/sub"
    note: "产量高，覆盖多地区"

  - name: "📡 Huibq 聚合"
    url: "https://raw.githubusercontent.com/Huibq/TrojanLinks/master/links/vmess"
    note: "Trojan/VLESS 补充"

  - name: "📱 Pawdroid 免费节点库"
    url: "https://raw.githubusercontent.com/Pawdroid/Free-servers/main/sub"
    note: "移动端精选"

  - name: "📡 shaoyouvip 每日更新"
    url: "https://raw.githubusercontent.com/shaoyouvip/free/main/all.yaml"
    note: "每日更新补充"

backups:
