# MetaFetch 订阅源清单 (Structured YAML Version)
# 重点聚焦实测测速源与抗丢包专属源（Hysteria2），剔除纯机械爬取的低质死节点源

# ==========================================
# ⚙️ 订阅池与精选策略全局配置
# ==========================================
settings:
  smart_pool:
    # --- 核心地区定义 ---
    # 定义哪些地区属于“低延迟、日常主力机房”，享有更多的入选名额
    # 【置空处理】：若留空或删除，自动使用默认值 ["HK", "JP", "US", "SG"]
    core_regions: ["HK", "JP", "US", "SG"]

    # --- 私有节点配额 (仅在配置了 PRIVATE_SOURCES 时生效) ---
    private:
      # 私有节点进入“♻️ 自动选择”和“🔰 延迟最低”的总数量上限
      # 【说明】：若填 -1 表示不限总数全部入选；填 0 表示不进自动选择；置空/不填则自动使用默认值 12
      max_total: 12

      # 核心地区(港/日/美/新)每个地区最多入选几个私有节点
      # 【规则】：在同一个核心地区内，按协议质量与测速分数从高到低排序，只取前 3 名；置空则默认 3
      core_per_region: 3

      # 非核心地区(如德/英/法/韩等)每个地区最多入选几个私有节点
      # 【规则】：按分数排序，每个非核心地区只取第 1 名代表入选；置空则默认 1
      other_per_region: 1

    # --- 公共免费节点配额 (用于日常兜底与纯免费模式) ---
    public:
      # 核心地区(港/日/美/新)每个地区最多入选几个免费节点进行兜底；置空默认 8
      core_per_region: 8

      # 非核心地区每个地区最多入选几个免费节点进行兜底；置空默认 4
      other_per_region: 4

    # --- 自动选择池全局容量保障 ---
    # 自动选择池保底最少节点数（若私有+公共总精选数不足此值，自动从其他海外节点按分数补齐；置空默认 20）
    min_pool_size: 20

    # 自动选择池最大总容量上限（私有精选 + 公共兜底的总节点数绝不超过此值；置空默认 120）
    max_pool_size: 120

sources:
  # ==========================================
  # 👑 实测高可用源：上游已进行真实测速 / 连通性测试
  # ==========================================
  - name: "🏆 huiwin NodeCollection (4h 自动测速清洗)"
    url: "https://raw.githubusercontent.com/huiwin/NodeCollection/main/output/clash/latest.yaml"
    note: "全协议覆盖，每 4 小时多线程连通与测速清洗，真实存活率 85%+"

  - name: "[动态日期] NodeFree YAML"
    url: "https://node.nodefree.me/%Y/%m/%Y%m%d.yaml"
    note: "每日上午实测筛选，提供高存活率、低延迟的优质精选节点"

  - name: "📱 Pawdroid 免费节点库"
    url: "https://raw.githubusercontent.com/Pawdroid/Free-servers/main/sub"
    note: "每 6 小时自动更新的移动端精选（实测包含高速全绿新西兰等）"

