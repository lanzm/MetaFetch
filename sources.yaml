    url: "https://clashgithub.com/wp-content/uploads/rss/%Y%m%d.txt"
    enabled: false
    note: "大池备用，未测速"

  - name: "[长效备份] peasoft 精选"
    url: "https://gist.githubusercontent.com/peasoft/7907a8ee2a4fa5e80cd1bd006664442c/raw/"
    recursive: true
    enabled: false

  - name: "📡 FreeFQ 每日福利"
    url: "https://raw.githubusercontent.com/freefq/free/master/v2"
    enabled: false

  - name: "[动态日期] NodeFree TXT"
    url: "https://node.nodefree.me/%Y/%m/%Y%m%d.txt"
    enabled: false

  - name: "[动态日期] NodeFree YAML"
    url: "https://node.nodefree.me/%Y/%m/%Y%m%d.yaml"
    enabled: false

  - name: "[动态日期] v2rayShare TXT"
